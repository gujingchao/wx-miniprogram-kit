name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Test scaffold
        run: npm test --workspace create-wx-kit
      - name: Build dist
        run: npm run build

  mock-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
